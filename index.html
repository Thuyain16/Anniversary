<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>Interactive Love Surprise</title>
    <style>
        body {
            text-align: center;
            background-color: #ffe6e6;
            font-family: sans-serif;
            margin-top: 100px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            background-color: #ff4d4d;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ပြန်ချစ်ပါတော့နော် မမ... 💕</h2>
        <p>မေမေတောင်ချစ်ဘူးလား?</p>
        <!-- ခလုတ်နှစ်ခုစလုံးက "Yes" သို့မဟုတ် ကိုယ်လိုချင်တဲ့ အဖြေကိုပဲ သွားစေတာပါ -->
        <button onclick="alert('เย้! ချစ်တယ်နော် ❤️')">Yes</button>
        <button onclick="alert('เย้! ချစ်တယ်နော် ❤️')">Yes</button>
    </div>

</body>
</html>
